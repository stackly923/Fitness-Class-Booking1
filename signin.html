<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign In | STACKLY Fitness</title>
    <meta
      name="description"
      content="Sign in to manage STACKLY Fitness bookings, activity and membership."
    />
    <link rel="icon" href="favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main class="auth">
      <section class="auth-side">
        <a class="back-home" href="index.html">Back to Home</a>
        <a class="brand" href="index.html"><img class="brand-logo" src="assets/icons/stackly-logo-light.svg" alt="STACKLY Fitness" /></a>
        <div>
          <h1>Move Forward.</h1>
          <p>
            Every booking, session and milestone—together in one focused place.
          </p>
        </div>
        <a href="index.html">← Back to Home</a>
      </section>
      <section class="auth-form">
        <form id="signin-form" class="form-card">
          <p class="eyebrow">Sign in</p>
          <h2>Welcome Back</h2>
          <p>
            Sign in to manage your bookings, training activity and membership.
          </p>
          <div class="field">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
            /><small class="error"></small>
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
            /><small class="error"></small>
          </div>
          <p class="forgot-link"><a href="404.html">Forgot Password?</a></p>
          <div class="field">
            <label for="role">Role</label
            ><select id="role" name="role">
              <option value="" selected disabled hidden>Select role</option>
              <option value="member">Member</option>
              <option value="admin">Fitness Admin</option></select
            ><small class="error"></small>
          </div>
          <div class="auth-actions">
            <button class="btn btn-primary auth-submit" type="submit">
              Sign In
            </button>
            <a class="btn auth-secondary" href="register.html"
              >Create Account</a
            >
          </div>
        </form>
      </section>
    </main>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
